name: dbt CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install -e .

      - name: Debug secrets presence
        run: |
          echo "Account set: ${{ secrets.SNOWFLAKE_ACCOUNT != '' }}"
          echo "User set: ${{ secrets.SNOWFLAKE_USER != '' }}"
          echo "Password set: ${{ secrets.SNOWFLAKE_PASSWORD != '' }}"

      - name: Set up dbt profile
        run: |
          mkdir -p ./ci_profile
          cat <<EOF > ./ci_profile/profiles.yml
          d_classified:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ACCOUNTADMIN
                database: D_CLASSIFIED
                warehouse: COMPUTE_WH
                schema: STAGING
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps --profiles-dir ./ci_profile

      - name: dbt build
        run: dbt build --profiles-dir ./ci_profile